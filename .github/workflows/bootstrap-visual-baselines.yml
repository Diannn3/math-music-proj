name: Bootstrap visual baselines

on:
  push:
    branches:
      - "feature/28-visual-regression-performance"

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/28-visual-regression-performance

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Chromium baselines
        run: npx playwright test e2e/visual-regression.spec.ts e2e/visual-regression.mobile.spec.ts --project=chromium --project=mobile-chromium --update-snapshots

      - name: Commit generated snapshots
        run: |
          git add e2e
          if git diff --cached --quiet; then
            echo "Visual baselines already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): commit Chromium release baselines"
          git push origin HEAD:feature/28-visual-regression-performance
