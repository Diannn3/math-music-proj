name: Bootstrap release manifest

on:
  push:
    branches:
      - "feature/33-demo-submission-resilience"

permissions:
  contents: write

jobs:
  manifest:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/33-demo-submission-resilience

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic manifest
        run: python scripts/generate_release_manifest.py

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bifurcate-release-manifest.json
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "feat(submission): commit deterministic release manifest"
          git push origin HEAD:feature/33-demo-submission-resilience
