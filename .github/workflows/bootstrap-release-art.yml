name: Bootstrap release artwork

on:
  push:
    branches:
      - "feature/29-release-surface-metadata"

permissions:
  contents: write

jobs:
  artwork:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/29-release-surface-metadata

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic release artwork
        run: python scripts/generate_release_art.py

      - name: Commit generated release assets
        run: |
          if git diff --quiet -- public/bifurcate-social.png public/bifurcate-poster.png public/favicon.svg public/site.webmanifest && git ls-files --error-unmatch public/bifurcate-social.png >/dev/null 2>&1; then
            echo "release artwork already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bifurcate-social.png public/bifurcate-poster.png public/favicon.svg public/site.webmanifest
          git commit -m "feat(release): commit deterministic social and poster assets"
          git push origin HEAD:feature/29-release-surface-metadata
